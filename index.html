<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stress Detection Checker</title>
    <style>
      body {
        margin: 0;
        padding: 40px 16px;
        background: #f1f5f9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        box-sizing: border-box;
      }
      #root {
        width: 100%;
        max-width: 580px;
      }
      #root > div {
        background: #ffffff;
        padding: 28px;
        border-radius: 12px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      h2 {
        margin: 0 0 4px 0;
        font-size: 20px;
        color: #1e293b;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 14px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        font-size: 15px;
        line-height: 1.5;
        font-family: inherit;
        resize: vertical;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      textarea:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      }
      button {
        align-self: flex-start;
        background: #2563eb;
        color: white;
        border: none;
        padding: 10px 24px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s, transform 0.1s;
      }
      button:hover:not(:disabled) {
        background: #1d4ed8;
      }
      button:active:not(:disabled) {
        transform: scale(0.98);
      }
      button:disabled {
        background: #94a3b8;
        cursor: not-allowed;
      }
      p {
        margin: 0;
        font-size: 15px;
        line-height: 1.5;
        padding: 12px 14px;
        border-radius: 8px;
        background: #f8fafc;
        border-left: 4px solid #3b82f6;
      }
      small {
        color: #64748b;
        font-size: 12px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
